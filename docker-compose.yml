services:

  proxy:
    image: jupyterhub/configurable-http-proxy:4
    container_name: jupyterhub-proxy
    restart: always
    environment:
      - CONFIGPROXY_AUTH_TOKEN=CONFIGPROXY_AUTH_TOKEN
    command:
      - configurable-http-proxy
      - --ip=0.0.0.0
      - --port=8000
      - --api-ip=0.0.0.0
      - --api-port=8001
      - --default-target=http://hub:8081
      - --error-target=http://hub:8081/hub/error
    ports:
      - "8000:8000"
    networks:
      - jupyterhub-network

  hub:
    build:
      context: .
      dockerfile: Dockerfile.jupyterhub
    restart: always
    image: jupyterhub
    container_name: jupyterhub
    networks:
      - jupyterhub-network
    volumes:
      # The JupyterHub configuration file
      - "./config/jupyterhub_config.py:/srv/jupyterhub/jupyterhub_config.py:ro"
      # Bind Docker socket on the host so we can connect to the daemon from
      # within the container
      - "/var/run/docker.sock:/var/run/docker.sock:rw"
      # # Allow the container to use the host's PAM authentication
      # - "/etc/pam.d:/etc/pam.d:ro"
      # - "/etc/group:/etc/group:ro"
      # - "/etc/passwd:/etc/passwd:ro"
      # - "/etc/shadow:/etc/shadow:ro"
      # Bind Docker volume on host for JupyterHub database and cookie secrets
      - "jupyterhub-data:/data"
    environment:
      # This username will be a JupyterHub admin
      JUPYTERHUB_ADMIN: fnattino
    depends_on:
      - proxy
    command: ["jupyterhub", "-f", "/srv/jupyterhub/jupyterhub_config.py"]

  nginx:
    image: nginx:1.25-alpine
    ports:
      - 80:80
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - proxy
    command: [ "nginx", "-g", "daemon off;" ]
    networks:
      - jupyterhub-network

volumes:
  jupyterhub-data:

networks:
  jupyterhub-network:
    name: jupyterhub-network
