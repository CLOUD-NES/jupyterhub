name: Build JupyterLab image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "singleuser/**"
      - ".github/workflows/build-singleuser.yml"
  pull_request:
    paths:
      - "singleuser/**"
      - ".github/workflows/build-singleuser.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry image names must be lowercase
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jupyter-singleuser" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: git tag (e.g. v2026.10) on tag pushes, sha-<commit> on every
      # build, and latest on the default branch
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests only check that the image builds
      - uses: docker/build-push-action@v6
        with:
          context: singleuser
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
