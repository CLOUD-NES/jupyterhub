- name: Deploy JupyterHub on SURF Research Cloud
  hosts: localhost
  gather_facts: false
  vars:
    storage_dir: /data/{{ user_storage_name }}
  tasks:

  - name: Create directory for user homes and shared space on persistent storage
    file:
      path: "{{ storage_dir }}/{{ item }}"
      state: directory
      mode: '0755'
    loop:
    - users
    - shared

  - name: Pull the single-user JupyterLab image
    community.docker.docker_image:
      name: "{{ docker_notebook_image }}"
      source: pull
      pull:
        platform: amd64

  - name: Write .env for docker compose
    no_log: true
    copy:
      dest: "{{ playbook_dir }}/.env"
      mode: '0600'
      content: |
        CONFIGPROXY_AUTH_TOKEN='{{ lookup('password', '/dev/null chars=hexdigits length=64') }}'
        JUPYTERHUB_SHARED_PASSWORD='{{ jupyterhub_shared_password }}'
        JUPYTERHUB_ADMIN_USERS='{{ jupyterhub_admin_users | default('') }}'
        JUPYTERHUB_ADMIN_PASSWORD='{{ jupyterhub_admin_password | default('') }}'
        DOCKER_NOTEBOOK_IMAGE='{{ docker_notebook_image }}'
        USER_STORAGE_DIR='{{ storage_dir }}/users'
        SHARED_DIR='{{ storage_dir }}/shared'
        MEM_LIMIT='{{ mem_limit | default('2G') }}'
        CPU_LIMIT='{{ cpu_limit | default('1') }}'
        CULL_TIMEOUT='{{ cull_timeout | default('3600') }}'

  - name: Start JupyterHub
    community.docker.docker_compose_v2:
      project_src: "{{ playbook_dir }}"
      services:
      - hub
      wait: true
      wait_timeout: 60

  - name: Create nginx location block
    copy:
      dest: /etc/nginx/app-location-conf.d/jupyterhub.conf
      mode: '0644'
      content: |
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_redirect http://localhost:8000/ $scheme://$host/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            client_max_body_size 10G;
        }
      notify: Reload nginx

  handlers:

  - name: Reload nginx
    systemd:
      name: nginx
      state: reloaded
